name: Build

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'bugfix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Unit tests plus the tests that register real tasks in the runner's Task Scheduler.
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Run tests
        run: >
          dotnet test tests/FluentTaskScheduler.Tests
          -c Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --blame
          --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/

  # Publishes the app the way a release does, then drives the published exe through its UI.
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
            runner: windows-latest
          - platform: ARM64
            rid: win-arm64
            runner: windows-11-arm

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: >
          dotnet publish src/FluentTaskScheduler
          -c Release
          -p:Platform=${{ matrix.platform }}
          -o publish

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: FluentTaskScheduler-${{ matrix.rid }}
          path: publish/

      # The hosted runner's desktop defaults to 1024x768, smaller than the app's default window.
      # Only Windows Server has the command to change that; the ARM64 runner runs Windows 11.
      - name: Set screen resolution
        shell: pwsh
        run: |
          if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) {
            Set-DisplayResolution -Width 1920 -Height 1080 -Force
          } else {
            'This runner cannot change its screen resolution; the UI tests run at 1024x768.'
          }

      - name: Run UI tests
        env:
          FTS_APP_EXE: ${{ github.workspace }}\publish\FluentTaskScheduler.exe
          FTS_UI_ARTIFACTS: ${{ github.workspace }}\ui-artifacts
          # A fresh runner can show Windows' first sign-in screens on top of everything.
          FTS_UI_CLOSE_COVERING_WINDOWS: 1
        # A test held up by a dialog or by an app that stopped answering is ended after ten
        # minutes instead of holding the runner for hours. No dump: nothing would upload it.
        run: >
          dotnet test tests/FluentTaskScheduler.UITests
          -c Release
          --logger "console;verbosity=detailed"
          --blame-hang-timeout 10m
          --blame-hang-dump-type none

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-artifacts-${{ matrix.rid }}
          path: ui-artifacts/
