name: Build

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'bugfix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Run tests
        run: >
          dotnet test FluentTaskScheduler.Tests/FluentTaskScheduler.Tests.csproj
          -c Release
          -p:Platform=x64
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: FluentTaskScheduler.Tests/TestResults/test-results.trx

  build:
    needs: test
    strategy:
      matrix:
        include:
          - platform: x64
            rid: win-x64
            runner: windows-latest
          - platform: ARM64
            rid: win-arm64
            runner: windows-11-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: >
          dotnet publish
          -c Release
          -p:Platform=${{ matrix.platform }}
          --self-contained true

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: FluentTaskScheduler-${{ matrix.rid }}
          path: bin/${{ matrix.platform }}/Release/net8.0-windows10.0.19041.0/${{ matrix.rid }}/publish/
