name: Build

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'bugfix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Run tests
        run: >
          dotnet test FluentTaskScheduler.Tests/FluentTaskScheduler.Tests.csproj
          -c Release
          -p:Platform=x64
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --blame

      - name: Show which test crashed the host
        if: failure()
        shell: pwsh
        run: >
          Get-ChildItem FluentTaskScheduler.Tests/TestResults -Recurse -Filter 'Sequence_*.xml' |
          ForEach-Object { Get-Content $_.FullName -Tail 12 }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: FluentTaskScheduler.Tests/TestResults/

  ui-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build app
        run: dotnet build FluentTaskScheduler.csproj -c Release -p:Platform=x64

      # The hosted runner's desktop defaults to 1024x768, smaller than the app's default window.
      - name: Set screen resolution
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Run UI tests
        env:
          FTS_APP_EXE: ${{ github.workspace }}\bin\x64\Release\net8.0-windows10.0.19041.0\win-x64\FluentTaskScheduler.exe
          FTS_UI_ARTIFACTS: ${{ github.workspace }}\ui-artifacts
        run: >
          dotnet test FluentTaskScheduler.UITests/FluentTaskScheduler.UITests.csproj
          -c Release
          --logger "console;verbosity=detailed"

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-artifacts
          path: ui-artifacts/

  build:
    needs: test
    strategy:
      matrix:
        include:
          - platform: x64
            rid: win-x64
            runner: windows-latest
          - platform: ARM64
            rid: win-arm64
            runner: windows-11-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: >
          dotnet publish
          -c Release
          -p:Platform=${{ matrix.platform }}
          --self-contained true

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: FluentTaskScheduler-${{ matrix.rid }}
          path: bin/${{ matrix.platform }}/Release/net8.0-windows10.0.19041.0/${{ matrix.rid }}/publish/
