name: Release

# Builds both architectures, packs them with Velopack and checks on a fresh machine that the
# installer installs and uninstalls silently. Only then are the eight release files attached
# to a draft GitHub Release, which is reviewed and published by hand.
#
# A pushed tag like V2.0.1 always ends in that draft. A manual run packs the version typed in,
# runs the same check and keeps the files as artifacts of the run, which makes it the way to
# try the packaging out. With "draft" ticked it also creates the draft, for the commit it ran
# on, or brings the existing draft of that version up to date. A release that is already
# published is never touched.
on:
  push:
    tags: ['V*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to pack, e.g. 2.0.1
        required: true
      draft:
        description: Create the draft release of that version, or bring it up to date
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The Velopack command line tool. Without a version the newest one would be installed, which
  # is not necessarily one that understands the Velopack package the app references.
  VPK_VERSION: 1.2.161

jobs:
  package:
    strategy:
      matrix:
        include:
          - platform: x64
            arch: x64
          - platform: ARM64
            arch: arm64

    # Both architectures are built on an x64 machine: the WiX tools Velopack brings along for
    # the MSI are x64 programs and do not start on the ARM64 runner.
    runs-on: windows-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # The version comes from the tag (V1.9.1 gives 1.9.1) and goes into the build, so the app,
      # the installer and the update feed all carry the same number.
      - name: Determine version
        id: version
        shell: pwsh
        env:
          REQUESTED: ${{ inputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = if ($env:REQUESTED) { $env:REQUESTED } else { $env:TAG -replace '^[Vv]', '' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "'$version' is not a version like 1.9.1." }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      - name: Publish
        run: >
          dotnet publish src/FluentTaskScheduler
          -c Release
          -p:Platform=${{ matrix.platform }}
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Pack
        run: >
          vpk pack
          -u FluentTaskScheduler
          -v ${{ steps.version.outputs.version }}
          -c win-${{ matrix.arch }}
          -o Releases
          -p publish
          -e FluentTaskScheduler.exe
          --msi --instLocation Either
          --msiTopBanner Assets/MSI-Logo.bmp
          --msiDialogBackground Assets/MSI-Banner.bmp

      # Package managers and the README link to these exact names, and release downloads are
      # case-sensitive. The update feed (releases.*.json) and the update package keep the names
      # Velopack gave them, because the app's updater looks for those.
      - name: Collect release files
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: win-${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem Releases | Format-Table Name, Length

          # Velopack dates every entry of the portable zip 1980-01-01.
          Add-Type -Assembly System.IO.Compression.FileSystem
          $portable = "Releases/FluentTaskScheduler-$env:CHANNEL-Portable.zip"
          $archive = [System.IO.Compression.ZipFile]::Open($portable, 'Update')
          $now = Get-Date
          foreach ($entry in $archive.Entries) { $entry.LastWriteTime = $now }
          $archive.Dispose()

          New-Item -ItemType Directory -Force Dist | Out-Null
          Copy-Item $portable "Dist/Portable-$env:ARCH.zip"
          Copy-Item "Releases/FluentTaskScheduler-$env:CHANNEL.msi" "Dist/Setup-$env:ARCH.msi"
          Copy-Item "Releases/releases.$env:CHANNEL.json" Dist/
          Copy-Item "Releases/FluentTaskScheduler-$env:VERSION-$env:CHANNEL-full.nupkg" Dist/
          Get-ChildItem Dist | Format-Table Name, Length

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: Dist-${{ matrix.arch }}
          path: Dist/
          if-no-files-found: error

  # Installs what was just built the way winget and Chocolatey do, silently, and checks that
  # the installed app answers and that uninstalling removes it.
  verify-installer:
    needs: package
    runs-on: windows-latest
    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: Dist-x64
          path: Dist

      - name: Install, run and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Resolve-Path Dist/Setup-x64.msi).Path

          $install = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v install.log" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            Get-Content install.log -Tail 80
            throw "The installer ended with exit code $($install.ExitCode)."
          }

          # Where the app goes depends on what the installer decides, so its own log is asked.
          $folder = Select-String -Path install.log -Pattern 'Property\(S\): INSTALLFOLDER = (.+)$' |
                    Select-Object -Last 1 | ForEach-Object { $_.Matches[0].Groups[1].Value.Trim() }
          $exe = if ($folder) { Join-Path $folder 'current\FluentTaskScheduler.exe' }
          if (-not $exe -or -not (Test-Path $exe)) {
            Select-String -Path install.log -Pattern 'INSTALLFOLDER|TARGETDIR|ALLUSERS' | Select-Object -First 30 -ExpandProperty Line
            if ($folder) { Get-ChildItem $folder -Recurse -Depth 1 -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName }
            throw 'The installed app was not found.'
          }
          "Installed: $exe, version $((Get-Item $exe).VersionInfo.FileVersion)"

          $list = Start-Process $exe -ArgumentList '--list' -Wait -PassThru -NoNewWindow -RedirectStandardOutput list.json
          if ($list.ExitCode -ne 0) { throw "The installed app answered --list with exit code $($list.ExitCode)." }
          "The installed app lists $(@(Get-Content list.json -Raw | ConvertFrom-Json).Count) tasks."

          $uninstall = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstalling ended with exit code $($uninstall.ExitCode)." }
          if (Test-Path $exe) { throw 'The app is still there after uninstalling.' }

  draft-release:
    # A pushed tag always drafts a release, a manual run when it was asked to; neither does
    # unless everything above worked.
    if: github.event_name == 'push' || inputs.draft
    needs: [package, verify-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.package.outputs.version }}
      TAG: V${{ needs.package.outputs.version }}
    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          pattern: Dist-*
          path: Dist
          merge-multiple: true

      - name: Look for a release of this version
        id: existing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $listed = gh release list --limit 1000 --json tagName,isDraft
          if ($LASTEXITCODE -ne 0) { throw 'The releases could not be listed.' }
          $releases = @($listed | ConvertFrom-Json | Where-Object { $_.tagName -ceq $env:TAG })

          if ($releases | Where-Object { -not $_.isDraft }) {
            throw "$env:TAG is published. A published release is not touched: its files are what people have downloaded."
          }
          if ($releases.Count -gt 1) { throw "There are $($releases.Count) drafts named $env:TAG. Delete all but one of them." }
          "draft=$($releases.Count -eq 1)" >> $env:GITHUB_OUTPUT

      - name: Write the release notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $generated = gh api "repos/$env:GH_REPO/releases/generate-notes" -f "tag_name=$env:TAG" -f "target_commitish=$env:GITHUB_SHA" --jq .body
          if ($LASTEXITCODE -ne 0) { throw 'GitHub did not generate release notes.' }
          Set-Content notes.md $generated

      - name: Create the draft or bring it up to date
        shell: pwsh
        env:
          DRAFT_EXISTS: ${{ steps.existing.outputs.draft }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'Setup-x64.msi', 'Setup-arm64.msi', 'Portable-x64.zip', 'Portable-arm64.zip'
            'releases.win-x64.json', 'releases.win-arm64.json'
            "FluentTaskScheduler-$env:VERSION-win-x64-full.nupkg", "FluentTaskScheduler-$env:VERSION-win-arm64-full.nupkg"
          ) | ForEach-Object { (Get-Item "Dist/$_").FullName }

          if ($env:DRAFT_EXISTS -eq 'True') {
            gh release edit $env:TAG --target $env:GITHUB_SHA --notes-file notes.md
            if ($LASTEXITCODE -ne 0) { throw "The draft $env:TAG could not be changed." }

            $attached = gh release view $env:TAG --json assets --jq '.assets[].name'
            if ($LASTEXITCODE -ne 0) { throw "The files of the draft $env:TAG could not be listed." }
            foreach ($name in $attached) {
              gh release delete-asset $env:TAG $name --yes
              if ($LASTEXITCODE -ne 0) { throw "$name could not be removed from the draft $env:TAG." }
            }
            gh release upload $env:TAG $files
            if ($LASTEXITCODE -ne 0) { throw "The files could not be attached to the draft $env:TAG." }
          } else {
            gh release create $env:TAG --draft --target $env:GITHUB_SHA --title $env:TAG --notes-file notes.md $files
            if ($LASTEXITCODE -ne 0) { throw "The draft $env:TAG could not be created." }
          }
